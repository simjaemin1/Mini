<text x="16" y="28" font-size="20" font-weight="bold">T1460 은거지 둘레 — 시드 1020 · 두 해(도적 묶음 넷 + T1460)</text>
<text x="16" y="50" font-size="13" fill="#444">초록 = 숲(지형 숲 타원) · 회색 점 = 마을(엷은 원 = 마을 생활권 140칸) · 색 원 = 은거지(크기 ∝ 가장 컸던 무리 · 색 = 수명 짧음 빨강 → 김 파랑)</text>
<text x="16" y="66" font-size="13" fill="#444">점선 = 은거지 둘레 140칸 · 글 = 단 번호 · 가장 큰 무리 · 수명(날) · 둘레가 먹이는 수(남의 칸 뺀 실물 땅 · 맨손 · 석기)</text>
