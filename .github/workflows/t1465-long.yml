name: T1465 checkpointed thirty-year pair
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        stock: ['off', 'on']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - run: npm ci --omit=dev
      - run: bash scripts/t1465-long-remote.sh '${{ matrix.stock }}'
        env:
          T1465_LONG_OUT: ${{ runner.temp }}/t1465-long-${{ matrix.stock }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t1465-long-${{ matrix.stock }}-42
          path: ${{ runner.temp }}/t1465-long-${{ matrix.stock }}/
          retention-days: 7
