        if: contains(matrix.list, 'test-audio.js')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # ★[T1350] 배포 스크립트 하네스(`test-redeploy-light` · `test-redeploy`)는 가짜 docker 로 진짜 스크립트를 돌린다 — 스크립트가 `mkdir -p /srv/durango/<존>` 을 한다.
      #   분류 상자는 root 라 됐고 CI 러너(일반 사용자)에선 "0줄"로 빨갰다(이 가지 첫 CI 판). 쓰기 자리만 미리 연다(스크립트 · 하네스 글자 무변).
      - name: /srv/durango 쓰기 자리 (배포 스크립트 하네스)
        if: contains(matrix.list, 'test-redeploy')
        run: sudo mkdir -p /srv/durango && sudo chown "$(id -u):$(id -g)" /srv/durango
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: 분류표 하네스 (${{ matrix.shard }})
        run: bash scripts/run-regress.sh ${{ matrix.list }}

  server:
    name: 서버 하네스 ${{ matrix.srv }} (차례로 · 반드시 초록)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # ★[T1367] 분류표 (다) — 자식 프로세스가 존 · central · http 를 듣는다. 고정 포트를 쥐므로 **잡 안에서는 차례로**(러너 -j 1 · 나란히 0).
    #   올림 규칙은 core 와 같은 문턱(다섯 판 다 초록 · 가장 긴 판 60초 이하) — 목록은 `ci-class.js --write-yml --srv-shards K` 가 아래 표지 사이에 쓴다.
    #   잡이 여럿이면 잡마다 다른 러너 기계다(포트를 안 나눈다) — 같은 기계에서 나란히 도는 일은 없다.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # <ci-class srv — scripts/ci-class.js --write-yml 이 쓴다 · 손으로 고치지 않는다>
        # 분류표 2026-11-24 · 서버 51종 · 잡 2개(합 초 402 · 400 — 가장 긴 판 · 이 상자)
        include:
          - srv: '1/2'
            list: >-
              test-claim-v2.js
              test-drop-kg.js
              test-fixture-reap.js
              test-food-sick.js
              test-granary-age.js
              test-granary-item.js
              test-guest-rejoin.js
              test-jungwon-boot.js
              test-physical-stone-cycle.js
              test-preserve-carry.js
              test-regrow.js
              test-t1066-village-fire.js
              test-t1125-welcome.js
              test-t1146-stone-rule.js
              test-t1163-welcome-sig.js
              test-t1186-blade-wear.js
              test-t1405-leave-rare.js
              test-t1423-block-react.js
              test-t1438-decay.js
              test-t1440-road-rule.js
              test-t989-chunk-save.js
              test-terraincache.js
              test-weight.js
              test-well.js
              test-xhost-env.js
              test-zone-fauna.js
          - srv: '2/2'
            list: >-
              test-bridge-act.js
              test-donate.js
              test-doors.js
              test-emptystart.js
              test-fishing.js
              test-game-meat.js
              test-granary-rot.js
              test-guest-identity.js
              test-hall-units.js
              test-member-open.js
              test-mob-hp-door.js
              test-preserve.js
              test-reset-world.js
              test-shelter.js
              test-spoil2.js
              test-t1065-tool-gate.js
              test-t1093-shelter-roof.js
              test-t1118-rack-age.js
              test-t1120-next-tool.js
              test-t1126-rock-yield.js
              test-t1128-kcal-tidy.js
              test-t1132-hall-view.js
              test-t1238-terr-v2.js
              test-t1447-grudge.js
              test-t1454-slow.js
        # </ci-class srv>
    env:
      TIDE_FREEZE_MS: '372603'
      DRAIN_SEC: '3'      # 앞 판이 남긴 아이가 있을 때만 쉰다(T1161) — 포트를 놓을 틈
      TIMEOUT_SEC: '180'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ★[T1367] 배포 스크립트 하네스(`test-xhost-env` — 가짜 docker 로 `recreate … /srv/durango/central`)는 `/srv/durango` 를 쓴다 — core 잡의 같은 걸음(T1350)과 같다.
      #   이 잡 첫 판에 러너 일반 사용자라 Ⓐ①~⑥ 다섯이 빨갰다(분류 상자는 root). 쓰기 자리만 미리 연다(스크립트 · 하네스 글자 무변).
      - name: /srv/durango 쓰기 자리 (배포 스크립트 하네스)
        run: sudo mkdir -p /srv/durango && sudo chown "$(id -u):$(id -g)" /srv/durango
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: 서버 하네스 차례로 (${{ matrix.srv }})
        run: bash scripts/run-regress.sh ${{ matrix.list }}

  old-code-red:
    name: 옛 코드 빨강 (새 하네스는 옛 제품 위에서 빨강)
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TIDE_FREEZE_MS: '372603'
      TIMEOUT_SEC: '600'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: 가지가 갈라진 main 판(merge-base) 위에서 새 하네스
        run: |
          git config user.name ci && git config user.email ci@localhost
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE" ] || BASE="$(git merge-base HEAD origin/main)"
          echo "옛 판 = $BASE"
          bash scripts/pm-old-code-red.sh "$BASE"

  long:
    # ★[T1400 · T1383 회부 6] 긴 판(만진 것만) — 분류표의 `long`(잰 판 다 초록 · 가장 긴 판 60초 넘음 — `t1345-body-day` 449초 · `t1351-mine-clock` 652초 …)
    #   가운데 이 가지가 만진 것(`touched-harness <갈림점> --list` 와 겹침)만 차례로 돈다. 안 만졌으면 0종으로 바로 초록(수 초).
    #   core · 서버 잡의 60초 문턱은 그대로 — 긴 판은 늘 돌지 않고 만졌을 때만 문다(종전엔 야간 · 손으로만).
    name: 긴 판 (만진 것만 · 차례로)
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TIDE_FREEZE_MS: '372603'
      TIMEOUT_SEC: '1500'
      DRAIN_SEC: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: 만진 긴 판 고르기 · 차례로 돌기
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE" ] || BASE="$(git merge-base HEAD origin/main)"
          LONG="$(node scripts/ci-class.js --long | grep -vxF test-harness-lint.js || true)"
          PICK="$(node scripts/touched-harness.js "$BASE" --list | grep -xF -f <(printf '%s\n' $LONG) || true)"
          echo "갈림점 $BASE · 긴 판 $(printf '%s\n' $LONG | grep -c .)종 · 만진 것 $(printf '%s\n' $PICK | grep -c .)종: $(echo $PICK)"
          [ -n "$PICK" ] || { echo "만진 긴 판 0 — 초록"; exit 0; }
          bash scripts/run-regress.sh $PICK

  gate:
    name: CI 문 (필수 체크 하나)
    # ★[T1367] main 보호 규칙의 **필수 체크는 이 이름 하나**(문서/CI_main보호_안.md). 잡 이름이 바뀌어도(core 잡 수 `--shards` · 서버 잡 더함)
    #   GitHub 설정을 다시 안 고친다. gates · core(모든 잡) · server 가 다 success, old-code-red 는 success 또는 skipped(main push) 여야 초록.
    #   watch 는 안 본다(배지 안 깸 그대로).
    #   ★[T1375] 문서만 판(`changes` 가 code=false)이면 무거운 잡은 다 skipped 여야 초록 — `changes` 잡이 빨강이면 늘 빨강.
    if: always()
    needs: [changes, gates, core, server, old-code-red, long]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 잡 결과 모으기
        env:
          R_GATES: ${{ needs.gates.result }}
          R_CORE: ${{ needs.core.result }}
          R_SERVER: ${{ needs.server.result }}
          R_OLD: ${{ needs['old-code-red'].result }}
          R_LONG: ${{ needs.long.result }}
          R_CH: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "changes=$R_CH code=$CODE gates=$R_GATES core=$R_CORE server=$R_SERVER old-code-red=$R_OLD long=$R_LONG"
          [ "$R_CH" = success ] || { echo "빨강 — 바뀐 자리 잡 = $R_CH"; exit 1; }
          if [ "$CODE" = false ]; then
            [ "$R_GATES" = skipped ] && [ "$R_CORE" = skipped ] && [ "$R_SERVER" = skipped ] && [ "$R_OLD" = skipped ] && [ "$R_LONG" = skipped ] || { echo "빨강 — 문서만 판인데 무거운 잡이 돌았다(조건 어긋남)"; exit 1; }
            echo "초록 — CI 문(문서만 · 하네스 잡 건너뜀)"; exit 0
          fi
          [ "$R_GATES" = success ] && [ "$R_CORE" = success ] && [ "$R_SERVER" = success ] || { echo "빨강 — 반드시 초록인 잡이 초록이 아니다"; exit 1; }
          case "$R_OLD" in success|skipped) ;; *) echo "빨강 — 옛 코드 빨강 잡 = $R_OLD"; exit 1 ;; esac
          case "$R_LONG" in success|skipped) ;; *) echo "빨강 — 긴 판 잡 = $R_LONG"; exit 1 ;; esac   # ★[T1400] main push 면 skipped
          echo "초록 — CI 문"

  watch:
    name: 지켜보는 하나 (배지 안 깸)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      TIDE_FREEZE_MS: '372603'
      DRAIN_SEC: '1'
      TIMEOUT_SEC: '300'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      # ★[T1350 2026-11-17 · 9월 설명을 지금으로] 9월엔 둘 다 빨강이었다(test-tidal 부르는 자리 수 · test-events ㉜a 풍년 0).
      #   지금(main 11-17): test-tidal 은 초록이고 분류표 규칙을 넘으면 core 로 갔다(표 줄을 보라). test-events 는 단언이 초록인데
      #   혼자 120 ~ 180초가 걸려 종전 시한 180초에서 RC 124 로 끊긴 판이 있었다(11-13 ~ 11-15 넷) — 60초 규칙 밖이라 core 에 못 간다.
      #   여기서 시한 300초로 지켜본다(빨강이면 로그로 본다 · 배지는 안 깬다).
      - name: test-events (단언 초록 · 120 ~ 180초)
        run: bash scripts/run-regress.sh test-events.js
