# === .github/workflows/regress-unit.yml — 단위 회귀 CI [PM · 2026-09-05] ==================
#
# ★무엇을 돌리나: 회귀 하네스(143종 · 야간 창 3h43m 에 112종까지)는 CI 에 못 올린다 — 실클라(Playwright)·존 서버를
#   띄우고 2코어 부하가 거짓 빨강을 만든다는 걸 실측했다(공통.md §2 · 족보 111). 여기는 그중
#   **서버·브라우저를 안 띄우고 60초 안에 끝나는 단위 계층**만 push 마다 돈다(약 3분).
#   ★[T293 2026-09-14] 여기에 **게이트 셋**이 붙었다(번들 `--check` · 랩 인라인 `--check` · 랩 배선) — 셋 다 서버 0.
#   전수는 여전히 야간(망고링고 04:00 KST)이 main 에서 한다.
# ★러너는 레포의 것 하나(`scripts/run-regress.sh` — 파이프 종료코드·결과줄 0 = 크래시 판정). 여기서 사본 안 만든다.
# ★★[T1350 2026-11-17 · 재민 "CI 체크 표시를 믿을 수 있게"] 잡 넷:
#   · gates — 러너 자가 검사 · 게이트 셋(번들 · 랩 인라인 · 랩 배선).
#   · core — **분류표(`scripts/ci-class.js` → `scripts/ci-class.json`)가 뽑은** 하네스를 잡 몇 개로 나눠 돈다(손 목록 0).
#     올림 규칙: 프로세스 · 브라우저를 안 띄우거나(가) 자식 프로세스만(나) · 다섯 판 다 초록 · 가장 긴 판 60초 이하.
#     목록은 `node scripts/ci-class.js --write-yml` 이 아래 표지 사이에 쓴다 · `test-ci-list` 가 표와 같은지 본다(한 줄 빠져도 빨강).
#   · old-code-red — 가지 · PR 에서만: 새 하네스(`scripts/test-*.js` 새 파일)를 **옛 제품**(가지가 갈라진 main 판) 위에서 돌려 빨강이어야 통과
#     (`scripts/pm-old-code-red.sh <merge-base>` · `// @harness-only` 하네스는 건너뜀 — `test-harness-lint` ⑲).
#   · server — ★[T1367] 서버를 띄우는 하네스(다) 가운데 다섯 판 다 초록 · 가장 긴 판 60초 이하 — 고정 포트라 잡 안에서 차례로 · 잡 둘(다른 러너 기계)(목록은 표에서).
#   · gate — ★[T1367] 위 잡들의 결과를 모은 하나(main 보호 규칙의 필수 체크 이름 — 문서/CI_main보호_안.md).
#   · watch — 알면서 기다리는 것(배지 안 깸 · 로그엔 남음).
# ★TIDE_FREEZE_MS=372603 — test-body ⑯㉧ 은 물때에 따라 갈린다(T52 가 심었다 · 공통 상시 목록). 만조로 못 박는다.
# ★DRAIN_SEC=1 — 서버를 안 띄우는 하네스뿐이라 하네스 사이 8초 대기가 필요 없다.
name: regress-unit

# ★[PM 2026-11-17 · 재민 "테스트 강화" · 공통 규약 ⑧] 문서만 바뀐 커밋(카드 · 보고 · 인계 · 회부)은 건너뛴다 — 카드만 올리는 PM 커밋마다
#   하네스 전부가 돌던 낭비. 코드 · 하네스 · 계측이 한 줄이라도 섞이면 돈다. 착지 가지는 `batch/land<번호>` 로 먼저 올려 여기 초록을 보고 main 을 옮긴다.
# ★[T1375 · main 보호 규칙 앞] 그 거름을 워크플로 머리(`paths-ignore`)에서 **안**(`changes` 잡 + 잡마다 `if:`)으로 옮겼다 — 머리 거름은 워크플로를 아예 안 돌려
#   필수 체크(`CI 문`)가 Pending 으로 남는다(카드만 커밋이 보호된 main 에 못 오른다). 이제 문서만 커밋은 `changes` 만 돌고 무거운 잡은 조건으로 건너뛰며
#   (조건으로 건너뛴 잡 = Success) `CI 문` 이 초록이 된다. 문서 자리 글자는 종전 그대로(`scripts/ci-changes.sh` · 하네스 `test-ci-changes`).
on:
  push:
    branches: ['main', 'batch/**', 'claude/**', 'land/**']   # ★[T1350] 클라우드 세션 가지 · PM 착지 가지(main 앞에 먼저 올려 초록을 본다)
  pull_request:
  workflow_dispatch:

concurrency:
  group: regress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 바뀐 자리 (문서만이면 아래 잡 건너뜀)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.d.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        name: 코드가 바뀌었나(지시 · 보고 · 인계 · 회부 밖)
        run: bash scripts/ci-changes.sh "${{ github.event_name }}" "${{ github.event.before }}" "${{ github.event.pull_request.base.sha }}" | tee -a "$GITHUB_OUTPUT"

  gates:
    name: 러너 자가 검사 · 게이트 셋 · 하네스 규약
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRAIN_SEC: '1'
      TIMEOUT_SEC: '180'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # test-harness-lint ⑭ 는 하네스가 태어난 판까지 거슬러 본다
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: 러너 자가 검사 (크래시를 실패로 잡는가)
        run: bash scripts/run-regress.sh --selftest
      # ★[T293 2026-09-14] 게이트 셋 — 셋 다 서버·브라우저를 안 띄운다.
      #   · build-econ-bundle --check : 엔진 번들이 소스와 어긋났나(회귀검증 8종)
      #   · inline-engine --check     : 랩 HTML 의 인라인 블록이 낡았나
      #   · lab-wiring-check          : 랩이 정본 함수를 무는가(자명 통과 금지 줄 포함)
      - name: 게이트 셋 (번들 · 랩 인라인 · 랩 배선 — 서버 0)
        run: node sim/build-econ-bundle.js --check && node sim/inline-engine.js --check && node scripts/lab-wiring-check.js
      # ★[T1350] 하네스 규약 lint — 분류표로는 (나) · 혼자 60초 안팎(59.6 · 60.9초)이라 core 규칙(60초)의 경계에 있다. 하네스 규약(사본 0 · 고정 포트 ·
      #   `@harness-only` ⑲ …)의 문이라 시간과 상관없이 여기서 늘 돈다 — 표 밖에서 이름으로 부르는 것은 이 한 줄뿐(까닭 그대로 적음).
      - name: 하네스 규약 (test-harness-lint)
        run: bash scripts/run-regress.sh test-harness-lint.js

  core:
    name: 단위 회귀 ${{ matrix.shard }} (반드시 초록)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
