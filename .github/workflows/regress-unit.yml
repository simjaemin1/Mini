      #   ★[T1350] `test-nightly` 는 이제 클론 깊이와 무관하다(아이 nightly-run 에 `NIGHT_UNSHALLOW=0` · ⑬) — 11-11 ~ 11-17 빨강의 까닭이 그것이었다.
