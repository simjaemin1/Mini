name: T1465 independent measurement copies
on:
  push:
    branches: [batch/ore-stock-1123]
    paths: [.github/workflows/t1465-measure.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: paired-matrix, arm: off, seed: 1020, node: 24.22.1}
          - {kind: paired-matrix, arm: bundle, seed: 1020, node: 24.22.1}
          - {kind: paired-matrix, arm: off, seed: 7, node: 24.22.1}
          - {kind: paired-matrix, arm: bundle, seed: 7, node: 24.22.1}
          - {kind: paired-matrix, arm: off, seed: 42, node: 24.22.1}
          - {kind: paired-matrix, arm: bundle, seed: 42, node: 24.22.1}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --omit=dev
      - run: bash scripts/t1465-remote-matrix.sh '${{ matrix.seed }}' '${{ matrix.arm }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t1465-${{ matrix.kind }}-${{ matrix.arm }}-${{ matrix.seed }}
          path: |
            계측/T1465_2026-11-23/runs-stock-off/lab-${{ matrix.arm }}-${{ matrix.seed }}/
            계측/T1465_2026-11-23/baseline-off/lab-${{ matrix.arm }}-${{ matrix.seed }}/
            계측/T1465_2026-11-23/runs/lab-${{ matrix.arm }}-${{ matrix.seed }}/
            계측/T1465_2026-11-23/ablation/bundle-no-decrement-1020/
          retention-days: 7
